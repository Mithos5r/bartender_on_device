name: bartender_on_device
description: "Bartender On Device — an on-device, AI-powered cocktail assistant built with Flutter, running Google's Gemma 4 (E2B) locally via flutter_edge_ai + LiteRT LM."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_edge_ai: ^2.4.1
  flutter_edge_ai_litertlm: ^1.15.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  flutter_markdown_plus: ^1.0.11
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  #
